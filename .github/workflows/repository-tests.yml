name: 仓库离线测试
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: repository-tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 读取待测代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 准备Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 准备Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 运行离线检查
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @('测试通用入口.py','测试独立审计.py','测试材质依赖.py','测试六步指南.py','测试提交检查.py')
          foreach ($test in $tests) {
            python -X utf8 -B "scripts/验证/$test" -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/验证/测试六步页面交互.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B scripts/通用/生成六步指南.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B scripts/通用/分享工具包.py check
          exit $LASTEXITCODE
