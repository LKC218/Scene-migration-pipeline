name: 提交范围检查
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  statuses: write
jobs:
  policy:
    name: repository-policy-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 读取受信任的目标分支
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 准备Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 仅检查候选Git对象，不执行候选代码
        id: validate
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request_target ]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
            git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
            test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
            python -X utf8 -B scripts/协作/检查提交范围.py range --base "$BASE_SHA" --head "$TARGET_SHA" --policy-ref "$BASE_SHA"
          else
            python -X utf8 -B scripts/协作/检查提交范围.py range --base "$BASE_SHA" --head "$TARGET_SHA" --policy-ref "$TARGET_SHA"
          fi
      - name: 将结果绑定到实际候选提交
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULT: ${{ steps.validate.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          sha = os.environ['TARGET_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
              raise SystemExit('候选标识不合法')
          body = {'state': 'success' if os.environ['RESULT'] == 'success' else 'failure',
                  'context': 'repository-policy', 'description': '提交范围及内容检查',
                  'target_url': 'https://github.com/' + repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID']}
          request = urllib.request.Request('https://api.github.com/repos/' + repo + '/statuses/' + sha,
              data=json.dumps(body).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              print('已记录候选提交的检查结果')
          PY
